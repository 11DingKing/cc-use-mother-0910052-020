[project]
name = "ai-article-generator"
version = "1.0.0"
description = "AI自动生成文章并发布到CMS系统（纯Python实现）"
requires-python = ">=3.11"
authors = [
    { name = "AI Article Generator Team" }
]
dependencies = [
    # 后端 API 框架
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    # 桌面 GUI 界面
    "PySide6>=6.6.0",
    # 数据库
    "sqlalchemy>=2.0.23",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
    # 数据验证
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # 环境变量
    "python-dotenv>=1.0.0",
    # HTTP 请求
    "requests>=2.31.0",
    # 定时任务
    "apscheduler>=3.10.4",
    # 文件解析
    "PyPDF2>=3.0.1",
    "pdfplumber>=0.10.3",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    # 文件上传
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "gui"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]
